plugins {
    id 'com.android.application'
}

def webUrl = providers.gradleProperty('WEB_APP_URL').orElse('https://facetalkai-production.up.railway.app').get()
def vCode = providers.gradleProperty('APP_VERSION_CODE').orElse('1').get().toInteger()
def vName = providers.gradleProperty('APP_VERSION_NAME').orElse('1.0.0').get()
def playStoreBuild = providers.gradleProperty('PLAY_STORE_BUILD').orElse('false').get().toBoolean()
def appId = providers.gradleProperty('APP_ID').orElse(playStoreBuild ? 'ai.abaj.tv' : 'ai.facetalk.app').get()

android {
    namespace 'ai.facetalk.app'
    compileSdk 35

    defaultConfig {
        applicationId appId
        minSdk 21
        targetSdk 35
        versionCode vCode
        versionName vName
        buildConfigField 'String', 'WEB_APP_URL', '"' + webUrl + '"'
        buildConfigField 'boolean', 'PLAY_STORE_BUILD', playStoreBuild.toString()
    }

    signingConfigs {
        release {
            storeFile rootProject.file('facetalk-upload-key.jks')
            storePassword 'FaceTalk2026'
            keyAlias 'facetalk'
            keyPassword 'FaceTalk2026'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            manifest.srcFile(playStoreBuild ? 'src/play/AndroidManifest.xml' : 'src/main/AndroidManifest.xml')
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
