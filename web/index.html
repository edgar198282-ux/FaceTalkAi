<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f8fe8">
<title>Abaj TV</title>
<style>
:root{
  --bg:#66baf3;
  --bg2:#2f8fe8;
  --card:#ffffff;
  --line:rgba(255,255,255,.34);
  --text:#0e2b44;
  --muted:#41657d;
  --accent:#0b7dde;
  --accent2:#38aaf0;
  --dark:#0c1115;
  --red:#e23a4d;
  --gold:#e3a600;
  --focus:#00a6ff;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#5ab5f0 0%,#3498e8 42%,#2486d5 100%);
  color:var(--text)
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#5ab5f0 0%,#3498e8 42%,#2486d5 100%)}
.top{
  background:linear-gradient(180deg,rgba(16,112,201,.95),rgba(53,163,234,.92));
  padding:12px 14px 10px;
  border-bottom:1px solid rgba(255,255,255,.32);
  position:sticky;top:0;z-index:20;
  backdrop-filter:blur(14px)
}
.titleRow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brandWrap{display:flex;align-items:center;gap:10px;min-width:0}.brandLogo{width:58px;height:58px;border-radius:16px;object-fit:contain;background:#083f9b;padding:3px;border:2px solid rgba(255,255,255,.70);box-shadow:0 5px 18px rgba(0,55,130,.34)}
.titleBlock{min-width:0}
.title{font-size:27px;font-weight:800;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 2px 7px rgba(0,58,120,.35)}
.sub{font-size:14px;color:#e8f6ff;margin-top:1px}
.icons{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.iconBtn{
  width:42px;height:42px;border:0;background:transparent;border-radius:50%;
  font-size:21px;color:#fff
}
.iconBtn:active,.iconBtn.active{background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;padding-top:10px}
.search,.select{
  height:46px;border:1px solid rgba(255,255,255,.62);border-radius:12px;background:rgba(255,255,255,.90);
  padding:0 14px;font-size:17px;outline:none;color:#34444d
}
.search:focus,.select:focus{border-color:#73c9f4;box-shadow:0 0 0 3px rgba(0,166,255,.12)}
.select{min-width:142px}
.chips,.quickCats{
  display:flex;gap:8px;overflow:auto;padding:10px 0 0;scrollbar-width:none
}
.chips::-webkit-scrollbar,.quickCats::-webkit-scrollbar{display:none}
.chip,.cat{
  border:1px solid #c9dde8;border-radius:20px;background:rgba(255,255,255,.86);color:#1f5377;
  padding:8px 14px;white-space:nowrap
}
.chip.active,.cat.active{background:#087fe1;color:#fff;border-color:#6ed0ff;box-shadow:0 4px 12px rgba(0,86,166,.28)}
.status{font-size:12px;color:#eff9ff;padding-top:8px;text-shadow:0 1px 2px rgba(0,60,110,.35)}
.content{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.list{padding:12px 12px 100px;background:linear-gradient(180deg,rgba(126,205,250,.38),rgba(84,179,238,.32));}
.groupTitle{
  font-size:14px;color:#5f7480;padding:9px 5px 6px;text-transform:uppercase;
  letter-spacing:.45px;font-weight:600
}
.channel{
  background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.74);border-radius:16px;margin-bottom:10px;
  display:grid;grid-template-columns:76px 1fr auto;min-height:88px;overflow:hidden;
  box-shadow:0 7px 18px rgba(0,74,130,.16)
}
.channel:active{transform:scale(.996)}
.logoWrap{background:linear-gradient(180deg,#edf9ff,#d8f0ff);display:flex;align-items:center;justify-content:center;padding:8px}
.logo{max-width:100%;max-height:60px;object-fit:contain}
.logoFallback{font-weight:800;color:#7c8f99;font-size:18px}
.info{padding:10px 8px;min-width:0}
.name{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{font-size:14px;color:#315f7c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;font-weight:600}.next{font-size:12px;color:#66869a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.progress{height:6px;background:#d2dfe5;margin-top:8px;position:relative}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#0788e8,#25c2ff);width:0;transition:width .35s ease}
.times{
  display:flex;justify-content:space-between;font-size:11px;color:white;
  background:#2c8fd2;padding:1px 5px;margin-top:-6px;position:relative;z-index:1
}
.side{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 7px}
.more,.fav{border:0;background:transparent;font-size:23px;color:#42515a}
.fav.on{color:var(--gold)}
.country{font-size:11px;color:#7b8d96}
.empty{padding:45px 20px;text-align:center;color:#66808d}
.playerView{
  position:fixed;inset:0;background:#000;color:#fff;z-index:100;display:none;flex-direction:column
}
.playerView.open{display:flex}
.playerTop{
  height:58px;display:flex;align-items:center;gap:12px;padding:0 12px;background:rgba(0,0,0,.86)
}
.back{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:white;font-size:29px}
.playerTitle{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.videoWrap{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
video{width:100%;height:100%;object-fit:contain;background:#000}
.playerBottom{padding:12px 14px 18px;background:#0a0a0a;border-top:1px solid #222}
.playerMeta{display:flex;justify-content:space-between;gap:10px;align-items:center}
.live{color:#ff4052;font-size:13px}
.controls{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.ctrl{border:0;background:#1a1a1a;color:#fff;border-radius:12px;padding:11px 15px;font-size:14px}
.ctrl:active{background:#2a2a2a}
.channelRail{
  position:absolute;right:12px;top:70px;bottom:130px;width:240px;
  background:rgba(8,12,15,.88);border-radius:14px;padding:8px;overflow:auto;display:none
}
.railItem{padding:9px 10px;border-radius:10px;color:#ddd;font-size:14px}
.railItem.active{background:#6f8188;color:#fff}
.gridMode .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gridMode .channel{display:block;margin:0}
.gridMode .channel .logoWrap{height:112px}
.gridMode .channel .info{padding:10px}
.gridMode .channel .side{flex-direction:row;padding:0 10px 10px}
.tvMode .top{padding:18px 22px 14px}
.tvMode .title{font-size:32px}
.tvMode .search,.tvMode .select{height:54px;font-size:20px}
.tvMode .chip,.tvMode .cat{font-size:18px;padding:10px 17px}
.tvMode .content{padding:10px 18px}
.tvMode .list{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding-bottom:60px
}
.tvMode .groupTitle{grid-column:1/-1;font-size:18px}
.tvMode .channel{display:block;margin:0;min-height:190px;outline:none}
.tvMode .channel .logoWrap{height:110px}
.tvMode .channel .info{padding:11px}
.tvMode .channel .side{flex-direction:row;padding:0 10px 10px}
.tvMode .channel.focused,.tvMode .channel:focus{
  box-shadow:0 0 0 5px var(--focus),0 8px 22px rgba(0,109,166,.28);
  transform:scale(1.035);z-index:2
}
.tvMode .channelRail{display:block}
.tvMode .videoWrap{padding-right:264px}
.badge{
  display:inline-flex;align-items:center;gap:5px;background:#eaf7fd;border:1px solid #cde7f2;
  border-radius:999px;padding:4px 9px;color:#53707e;font-size:12px;margin-top:7px
}
@media(min-width:800px){
  .app{max-width:1400px;margin:auto;border-left:1px solid #cfe4ef;border-right:1px solid #cfe4ef}
  .gridMode .list{grid-template-columns:repeat(4,minmax(0,1fr))}
  .playerView{left:50%;transform:translateX(-50%);max-width:1400px}
}
@media(max-width:1000px){
  .tvMode .list{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:700px){
  .tvMode .list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tvMode .videoWrap{padding-right:0}
  .tvMode .channelRail{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="titleRow">
      <div class="brandWrap">
        <img class="brandLogo" src="/static/abaj_tv_logo.svg" alt="Abaj TV">
        <div class="titleBlock">
          <div class="title">ABAJ TV</div>
          <div class="sub">Армения + Россия</div>
        </div>
      </div>
      <div class="icons">
        <button id="listBtn" class="iconBtn active" onclick="setLayout('list')" title="Список">☷</button>
        <button id="gridBtn" class="iconBtn" onclick="setLayout('grid')" title="Плитка">▦</button>
        <button id="tvBtn" class="iconBtn" onclick="toggleTvMode()" title="TV режим">📺</button>
        <button class="iconBtn" onclick="refreshChannels()" title="Обновить">↻</button>
      </div>
    </div>
    <div class="toolbar">
      <input id="search" class="search" placeholder="Поиск канала" oninput="render()">
      <select id="group" class="select" onchange="render()"><option value="">ALL</option></select>
    </div>
    <div class="chips">
      <button class="chip active" data-filter="all" onclick="setModeFilter(this,'all')">ALL</button>
      <button class="chip" data-filter="AM" onclick="setModeFilter(this,'AM')">🇦🇲 ARMENIA</button>
      <button class="chip" data-filter="RU" onclick="setModeFilter(this,'RU')">🇷🇺 RUSSIA</button>
      <button class="chip" data-filter="fav" onclick="setModeFilter(this,'fav')">♡ FAVORITES</button>
      <button class="chip" data-filter="recent" onclick="setModeFilter(this,'recent')">↺ RECENT</button>
    </div>
    <div class="quickCats" id="quickCats"></div>
    <div class="status" id="status">Загрузка каналов…</div>
  </header>

  <main class="content" id="content">
    <div class="list" id="list"></div>
  </main>
</div>

<div class="playerView" id="playerView">
  <div class="playerTop">
    <button class="back" onclick="closePlayer()">‹</button>
    <div class="playerTitle" id="playerTitle">Канал</div>
    <button class="iconBtn" style="color:white" onclick="togglePlayerFavorite()">♡</button>
  </div>
  <div class="videoWrap">
    <video id="video" controls playsinline webkit-playsinline></video>
    <div id="channelRail" class="channelRail"></div>
  </div>
  <div class="playerBottom">
    <div class="playerMeta">
      <div>
        <b id="playerName"></b>
        <div id="playerGroup" style="font-size:13px;color:#aaa;margin-top:2px"></div>
      </div>
      <div class="live">● LIVE</div>
    </div>
    <div class="controls">
      <button class="ctrl" onclick="playPrev()">◀ Канал</button>
      <button class="ctrl" onclick="toggleFullscreen()">⛶ Полный экран</button>
      <button class="ctrl" onclick="togglePiP()">▣ PiP</button>
      <select id="qualitySelect" class="ctrl" onchange="setQuality(this.value)" style="appearance:auto">
        <option value="-1">Auto</option>
      </select>
      <button class="ctrl" onclick="playNext()">Канал ▶</button>
      <button class="ctrl" onclick="closePlayer()">Закрыть</button>
    </div>
    <div id="playerError" style="color:#ff7680;text-align:center;font-size:13px;margin-top:10px"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
let channels=[];
let modeFilter='all';
let activeCategory='';
let layout=localStorage.getItem('iptv_layout')||'list';
let tvMode=localStorage.getItem('iptv_tv_mode')==='1';
let hls=null;
let current=null;
let currentIndex=-1;
let filteredNow=[];
let focusIndex=0;
let streamRetries=0;
let reconnectTimer=null;
let lastChannelId=localStorage.getItem('iptv_last_channel')||'';

const favs=new Set(JSON.parse(localStorage.getItem('iptv_favorites')||'[]'));
let recent=JSON.parse(localStorage.getItem('iptv_recent')||'[]');

function esc(s){
  return String(s||'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function saveFavs(){localStorage.setItem('iptv_favorites',JSON.stringify([...favs]))}
function saveRecent(){localStorage.setItem('iptv_recent',JSON.stringify(recent.slice(0,30)))}

function setLayout(v){
  layout=v;
  localStorage.setItem('iptv_layout',v);
  document.getElementById('app').classList.toggle('gridMode',v==='grid'&&!tvMode);
  document.getElementById('listBtn').classList.toggle('active',v==='list');
  document.getElementById('gridBtn').classList.toggle('active',v==='grid');
  render();
}
function toggleTvMode(){
  tvMode=!tvMode;
  localStorage.setItem('iptv_tv_mode',tvMode?'1':'0');
  document.getElementById('app').classList.toggle('tvMode',tvMode);
  document.getElementById('tvBtn').classList.toggle('active',tvMode);
  document.getElementById('app').classList.toggle('gridMode',layout==='grid'&&!tvMode);
  focusIndex=0;
  render();
}
function setModeFilter(btn,v){
  modeFilter=v;
  document.querySelectorAll('.chip[data-filter]').forEach(x=>x.classList.toggle('active',x===btn));
  render();
}
function setCategory(v){
  activeCategory=v;
  document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x.dataset.cat===v));
  const sel=document.getElementById('group');
  if(v&&[...sel.options].some(o=>o.value===v))sel.value=v;
  else if(!v)sel.value='';
  render();
}
function toggleFav(id){
  if(favs.has(id))favs.delete(id);else favs.add(id);
  saveFavs();
  render();
}
function togglePlayerFavorite(){
  if(!current)return;
  if(favs.has(current.id))favs.delete(current.id);else favs.add(current.id);
  saveFavs();
  renderRail();
}
function addRecent(id){
  recent=[id,...recent.filter(x=>x!==id)].slice(0,30);
  saveRecent();
}
function normalizeCat(group){
  const g=(group||'').toLowerCase();
  if(g.includes('news'))return 'News';
  if(g.includes('sport'))return 'Sports';
  if(g.includes('kids')||g.includes('children')||g.includes('animation'))return 'Kids';
  if(g.includes('movie')||g.includes('film'))return 'Movies';
  if(g.includes('music'))return 'Music';
  if(g.includes('general'))return 'General';
  return group||'Other';
}

async function load(){
  try{
    const r=await fetch('/api/iptv/channels',{cache:'no-store'});
    const d=await r.json();
    channels=(d.channels||[]).filter(x=>x.status==='ONLINE');
    const groups=[...new Set(channels.map(x=>x.group||'Other'))].sort((a,b)=>a.localeCompare(b,'ru'));
    const sel=document.getElementById('group');
    const old=sel.value;
    sel.innerHTML='<option value="">ALL</option>'+groups.map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join('');
    if(groups.includes(old))sel.value=old;
    buildQuickCats(groups);
    document.getElementById('status').textContent=
      'Online: '+channels.length+
      ' · Offline в проверке: '+((d.stats||{}).offline||0)+
      (d.running?' · обновляется…':'');
    render();
    if(lastChannelId&&!current&&document.visibilityState==='visible'){
      const last=channels.find(x=>x.id===lastChannelId);
      if(last)document.getElementById('status').textContent+=' · Последний: '+last.name;
    }
  }catch(e){
    document.getElementById('status').textContent='Ошибка загрузки каналов';
  }
}
function buildQuickCats(groups){
  const preferred=['General','News','Sports','Movies','Kids','Music'];
  const normalized=new Set(groups.map(normalizeCat));
  const cats=preferred.filter(x=>normalized.has(x));
  document.getElementById('quickCats').innerHTML=
    '<button class="cat active" data-cat="" onclick="setCategory(\'\')">Все категории</button>'+
    cats.map(x=>'<button class="cat" data-cat="'+esc(x)+'" onclick="setCategory(\''+x+'\')">'+esc(x)+'</button>').join('');
}
async function refreshChannels(){
  document.getElementById('status').textContent='Обновление каналов…';
  try{await fetch('/api/iptv/refresh',{method:'POST'})}catch(e){}
  setTimeout(load,2500);
  setTimeout(load,9000);
}
function getFiltered(){
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  const g=document.getElementById('group').value||'';
  let rows=channels.slice();
  if(modeFilter==='AM'||modeFilter==='RU')rows=rows.filter(x=>x.country===modeFilter);
  if(modeFilter==='fav')rows=rows.filter(x=>favs.has(x.id));
  if(modeFilter==='recent'){
    const pos=new Map(recent.map((id,i)=>[id,i]));
    rows=rows.filter(x=>pos.has(x.id)).sort((a,b)=>pos.get(a.id)-pos.get(b.id));
  }
  if(g)rows=rows.filter(x=>(x.group||'Other')===g);
  if(activeCategory)rows=rows.filter(x=>normalizeCat(x.group)===activeCategory);
  if(q)rows=rows.filter(x=>(x.name||'').toLowerCase().includes(q));
  return rows;
}
function fmtClock(ts){
  if(!ts)return '';
  try{return new Date(ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}catch(e){return '';}
}
function epgProgress(p){
  if(!p||!p.start||!p.stop||p.stop<=p.start)return 0;
  const now=Date.now()/1000;
  return Math.max(0,Math.min(100,((now-p.start)/(p.stop-p.start))*100));
}

function render(){
  filteredNow=getFiltered();
  const grouped={};
  filteredNow.forEach(x=>{
    const k=x.group||'Other';
    (grouped[k]||(grouped[k]=[])).push(x);
  });
  let out='';
  Object.keys(grouped).sort((a,b)=>a.localeCompare(b,'ru')).forEach(group=>{
    if(!tvMode&&layout!=='grid')out+='<div class="groupTitle">'+esc(group)+'</div>';
    grouped[group].forEach(ch=>{
      const logo=ch.logo
        ?'<img class="logo" src="'+esc(ch.logo)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><div class="logoFallback" style="display:none">TV</div>'
        :'<div class="logoFallback">TV</div>';
      out+='<div class="channel" tabindex="'+(tvMode?'0':'-1')+'" data-id="'+esc(ch.id)+'" onclick="openPlayer(\''+ch.id+'\')">'+
        '<div class="logoWrap">'+logo+'</div>'+
        '<div class="info">'+
          '<div class="name">'+esc(ch.name)+'</div>'+
          '<div class="now">'+esc((ch.epg_now&&ch.epg_now.title)||ch.group||'Live')+'</div>'+
          '<div class="progress"><span style="width:'+epgProgress(ch.epg_now)+'%"></span></div>'+
          '<div class="times"><span>'+(ch.epg_now?fmtClock(ch.epg_now.start):'LIVE')+'</span><span>'+(ch.epg_now?fmtClock(ch.epg_now.stop):Math.max(1,Math.round((ch.latency_ms||0)/1000))+'s')+'</span></div>'+
          (ch.epg_next?'<div class="next">Далее: '+esc(ch.epg_next.title)+'</div>':'')+
          '<div class="badge">'+(ch.country==='AM'?'🇦🇲 Armenia':'🇷🇺 Russia')+'</div>'+
        '</div>'+
        '<div class="side">'+
          '<button class="more" onclick="event.stopPropagation()">⋮</button>'+
          '<button class="fav '+(favs.has(ch.id)?'on':'')+'" onclick="event.stopPropagation();toggleFav(\''+ch.id+'\')">♡</button>'+
          '<div class="country">'+(ch.country==='AM'?'AM':'RU')+'</div>'+
        '</div>'+
      '</div>';
    });
  });
  document.getElementById('list').innerHTML=out||'<div class="empty">Каналы не найдены</div>';
  bindTvFocus();
}
function bindTvFocus(){
  if(!tvMode)return;
  const cards=[...document.querySelectorAll('.channel')];
  if(!cards.length)return;
  focusIndex=Math.max(0,Math.min(focusIndex,cards.length-1));
  cards.forEach((x,i)=>x.classList.toggle('focused',i===focusIndex));
  cards[focusIndex].focus({preventScroll:true});
}
function moveFocus(delta){
  const cards=[...document.querySelectorAll('.channel')];
  if(!cards.length)return;
  focusIndex=Math.max(0,Math.min(cards.length-1,focusIndex+delta));
  cards.forEach((x,i)=>x.classList.toggle('focused',i===focusIndex));
  cards[focusIndex].focus({preventScroll:true});
  cards[focusIndex].scrollIntoView({block:'nearest',behavior:'smooth'});
}
function openFocused(){
  const cards=[...document.querySelectorAll('.channel')];
  if(cards[focusIndex])openPlayer(cards[focusIndex].dataset.id);
}

function openPlayer(id){
  const ch=channels.find(x=>x.id===id);
  if(!ch)return;
  current=ch;
  lastChannelId=ch.id;
  localStorage.setItem('iptv_last_channel',ch.id);
  streamRetries=0;
  if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}
  addRecent(ch.id);
  filteredNow=getFiltered();
  currentIndex=Math.max(0,filteredNow.findIndex(x=>x.id===id));
  document.getElementById('playerTitle').textContent=ch.name;
  document.getElementById('playerName').textContent=ch.name;
  document.getElementById('playerGroup').textContent=
    (ch.country==='AM'?'Армения':'Россия')+' · '+((ch.epg_now&&ch.epg_now.title)||ch.group||'Live');
  document.getElementById('playerError').textContent='';
  document.getElementById('playerView').classList.add('open');
  startStream(ch);
  renderRail();
}
function startStream(ch){
  const v=document.getElementById('video');
  const err=document.getElementById('playerError');
  err.textContent='';
  if(hls){hls.destroy();hls=null}
  v.pause();v.removeAttribute('src');v.load();
  const src='/api/iptv/play?id='+encodeURIComponent(ch.id)+'&t='+Date.now();
  resetQualityMenu();

  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({
      enableWorker:true,
      lowLatencyMode:false,
      maxBufferLength:30,
      manifestLoadingTimeOut:12000,
      levelLoadingTimeOut:12000,
      fragLoadingTimeOut:15000
    });
    hls.loadSource(src);
    hls.attachMedia(v);

    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      streamRetries=0;
      updateQualityMenu();
      v.play().catch(()=>{});
    });

    hls.on(Hls.Events.LEVEL_SWITCHED,()=>updateQualityMenu());

    hls.on(Hls.Events.ERROR,(event,data)=>{
      if(!data||!data.fatal)return;

      if(data.type===Hls.ErrorTypes.NETWORK_ERROR && streamRetries<3){
        streamRetries++;
        err.textContent='Переподключение… '+streamRetries+'/3';
        try{hls.startLoad()}catch(e){scheduleReconnect(ch)}
        return;
      }

      if(data.type===Hls.ErrorTypes.MEDIA_ERROR && streamRetries<3){
        streamRetries++;
        err.textContent='Восстановление потока… '+streamRetries+'/3';
        try{hls.recoverMediaError()}catch(e){scheduleReconnect(ch)}
        return;
      }

      scheduleReconnect(ch);
    });
  }else{
    v.src=src;v.load();
    v.play().then(()=>{streamRetries=0}).catch(()=>scheduleReconnect(ch));
  }
}

function scheduleReconnect(ch){
  const err=document.getElementById('playerError');
  if(reconnectTimer)return;
  if(streamRetries>=5){
    err.textContent='Поток временно недоступен. Попробуйте следующий канал.';
    return;
  }
  streamRetries++;
  err.textContent='Автопереподключение через 2 сек…';
  reconnectTimer=setTimeout(()=>{
    reconnectTimer=null;
    if(current&&current.id===ch.id)startStream(ch);
  },2000);
}

function resetQualityMenu(){
  const s=document.getElementById('qualitySelect');
  if(!s)return;
  s.innerHTML='<option value="-1">Auto</option>';
  s.value='-1';
}

function updateQualityMenu(){
  const s=document.getElementById('qualitySelect');
  if(!s||!hls)return;
  const previous=s.value;
  const opts=['<option value="-1">Auto</option>'];
  const seen=new Set();
  (hls.levels||[]).forEach((lvl,i)=>{
    const label=(lvl.height?lvl.height+'p':((Math.round((lvl.bitrate||0)/1000))+' kbps'));
    if(seen.has(label))return;
    seen.add(label);
    opts.push('<option value="'+i+'">'+label+'</option>');
  });
  s.innerHTML=opts.join('');
  if([...s.options].some(o=>o.value===previous))s.value=previous;
}

function setQuality(value){
  if(!hls)return;
  const level=parseInt(value,10);
  hls.currentLevel=Number.isFinite(level)?level:-1;
}

async function togglePiP(){
  const v=document.getElementById('video');
  try{
    if(document.pictureInPictureElement){
      await document.exitPictureInPicture();
      return;
    }
    if(document.pictureInPictureEnabled&&v.requestPictureInPicture){
      await v.requestPictureInPicture();
    }
  }catch(e){}
}
function renderRail(){
  const rows=filteredNow.length?filteredNow:channels;
  document.getElementById('channelRail').innerHTML=rows.slice(0,80).map(ch=>
    '<div class="railItem '+(current&&current.id===ch.id?'active':'')+'" onclick="openPlayer(\''+ch.id+'\')">'+
    esc(ch.name)+'</div>'
  ).join('');
}
function closePlayer(){
  if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}
  if(hls){hls.destroy();hls=null}
  const v=document.getElementById('video');
  v.pause();v.removeAttribute('src');v.load();
  document.getElementById('playerView').classList.remove('open');
  current=null;currentIndex=-1;
}
function playNext(){
  const rows=filteredNow.length?filteredNow:channels;
  if(!rows.length)return;
  currentIndex=(currentIndex+1+rows.length)%rows.length;
  openPlayer(rows[currentIndex].id);
}
function playPrev(){
  const rows=filteredNow.length?filteredNow:channels;
  if(!rows.length)return;
  currentIndex=(currentIndex-1+rows.length)%rows.length;
  openPlayer(rows[currentIndex].id);
}
async function toggleFullscreen(){
  const v=document.getElementById('video');
  try{
    if(document.fullscreenElement){await document.exitFullscreen();return}
    if(v.requestFullscreen){await v.requestFullscreen();return}
    if(v.webkitEnterFullscreen){v.webkitEnterFullscreen();return}
  }catch(e){}
}

document.addEventListener('keydown',e=>{
  const playerOpen=document.getElementById('playerView').classList.contains('open');
  if(playerOpen){
    if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();closePlayer();return}
    if(e.key==='ArrowDown'){e.preventDefault();playNext();return}
    if(e.key==='ArrowUp'){e.preventDefault();playPrev();return}
    if(e.key==='Enter'){
      const v=document.getElementById('video');
      e.preventDefault();
      if(v.paused)v.play().catch(()=>{});else v.pause();
      return;
    }
  }
  if(!tvMode)return;
  if(e.key==='ArrowRight'){e.preventDefault();moveFocus(1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();moveFocus(-1)}
  else if(e.key==='ArrowDown'){e.preventDefault();moveFocus(4)}
  else if(e.key==='ArrowUp'){e.preventDefault();moveFocus(-4)}
  else if(e.key==='Enter'){e.preventDefault();openFocused()}
});

document.getElementById('app').classList.toggle('tvMode',tvMode);
document.getElementById('tvBtn').classList.toggle('active',tvMode);
setLayout(layout);
load();
setInterval(load,60000);
</script>
</body>
