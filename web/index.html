<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5">
<title>IPTV Player</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--line:#dedede;--text:#333;--muted:#808080;--accent:#64737a;--dark:#101010;--red:#e30613}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{background:#fff;padding:14px 18px 10px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}
.titleRow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.titleBlock{min-width:0}
.title{font-size:25px;font-weight:400;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:14px;color:#888;margin-top:2px}
.icons{display:flex;gap:6px}
.iconBtn{width:42px;height:42px;border:0;background:transparent;border-radius:50%;font-size:22px;color:#444}
.iconBtn:active{background:#ececec}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;padding-top:10px}
.search{height:46px;border:0;border-radius:12px;background:#e6e6e6;padding:0 14px;font-size:17px;outline:none}
.select{height:46px;border:0;border-radius:12px;background:#e6e6e6;padding:0 36px 0 14px;color:#555;min-width:150px}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 0 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;border-radius:18px;background:#e3e3e3;color:#555;padding:8px 14px;white-space:nowrap}
.chip.active{background:#68777e;color:white}
.status{font-size:12px;color:#888;padding-top:8px}
.content{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.list{padding:10px 12px 100px}
.channel{background:#fff;border:1px solid #e8e8e8;border-radius:14px;margin-bottom:10px;display:grid;grid-template-columns:74px 1fr auto;min-height:86px;overflow:hidden}
.logoWrap{background:#f0f0f0;display:flex;align-items:center;justify-content:center;padding:8px}
.logo{max-width:100%;max-height:58px;object-fit:contain}
.logoFallback{font-weight:700;color:#7c7c7c;font-size:20px}
.info{padding:10px 8px;min-width:0}
.name{font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{font-size:14px;color:#707070;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.progress{height:6px;background:#cfd2d3;margin-top:8px;position:relative}
.progress span{display:block;height:100%;background:#7b898e;width:38%}
.times{display:flex;justify-content:space-between;font-size:11px;color:white;background:#7b898e;padding:1px 5px;margin-top:-6px;position:relative;z-index:1}
.side{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 6px}
.more,.fav{border:0;background:transparent;font-size:22px;color:#444}
.fav.on{color:#e0a600}
.country{font-size:11px;color:#888}
.groupTitle{font-size:14px;color:#777;padding:7px 5px 6px;text-transform:uppercase;letter-spacing:.4px}
.empty{padding:45px 20px;text-align:center;color:#888}
.playerView{position:fixed;inset:0;background:#000;color:#fff;z-index:100;display:none;flex-direction:column}
.playerView.open{display:flex}
.playerTop{height:56px;display:flex;align-items:center;gap:12px;padding:0 12px;background:rgba(0,0,0,.82)}
.back{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:white;font-size:28px}
.playerTitle{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.videoWrap{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
video{width:100%;height:100%;object-fit:contain;background:#000}
.playerBottom{padding:12px 14px 18px;background:#0a0a0a;border-top:1px solid #222}
.playerMeta{display:flex;justify-content:space-between;gap:10px;align-items:center}
.live{color:#ff3344;font-size:13px}
.controls{display:flex;justify-content:center;gap:22px;margin-top:12px}
.ctrl{border:0;background:#171717;color:#fff;border-radius:12px;padding:11px 16px;font-size:15px}
.gridMode .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gridMode .channel{display:block;margin:0}
.gridMode .channel .logoWrap{height:105px}
.gridMode .channel .info{padding:10px}
.gridMode .channel .side{flex-direction:row;padding:0 10px 10px}
@media(min-width:800px){
 .app{max-width:1200px;margin:auto;border-left:1px solid #ddd;border-right:1px solid #ddd}
 .gridMode .list{grid-template-columns:repeat(4,minmax(0,1fr))}
 .playerView{left:50%;transform:translateX(-50%);max-width:1200px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="titleRow">
      <div class="titleBlock">
        <div class="title">IPTV PLAYER</div>
        <div class="sub">Армения + Россия</div>
      </div>
      <div class="icons">
        <button class="iconBtn" onclick="toggleGrid()" title="Вид">▦</button>
        <button class="iconBtn" onclick="refreshChannels()" title="Обновить">↻</button>
        <button class="iconBtn" onclick="toggleFavorites()" title="Избранное">♡</button>
      </div>
    </div>
    <div class="toolbar">
      <input id="search" class="search" placeholder="Поиск канала" oninput="render()">
      <select id="group" class="select" onchange="render()"><option value="">ALL</option></select>
    </div>
    <div class="chips">
      <button class="chip active" data-country="" onclick="setCountry(this,'')">ALL</button>
      <button class="chip" data-country="AM" onclick="setCountry(this,'AM')">🇦🇲 ARMENIA</button>
      <button class="chip" data-country="RU" onclick="setCountry(this,'RU')">🇷🇺 RUSSIA</button>
    </div>
    <div class="status" id="status">Загрузка каналов…</div>
  </header>

  <main class="content">
    <div class="list" id="list"></div>
  </main>
</div>

<div class="playerView" id="playerView">
  <div class="playerTop">
    <button class="back" onclick="closePlayer()">‹</button>
    <div class="playerTitle" id="playerTitle">Канал</div>
    <button class="iconBtn" style="color:white" onclick="togglePlayerFavorite()">♡</button>
  </div>
  <div class="videoWrap">
    <video id="video" controls playsinline webkit-playsinline></video>
  </div>
  <div class="playerBottom">
    <div class="playerMeta">
      <div><b id="playerName"></b><div id="playerGroup" style="font-size:13px;color:#aaa;margin-top:2px"></div></div>
      <div class="live">● Live</div>
    </div>
    <div class="controls">
      <button class="ctrl" onclick="toggleFullscreen()">⛶ Полный экран</button>
      <button class="ctrl" onclick="closePlayer()">Закрыть</button>
    </div>
    <div id="playerError" style="color:#ff7680;text-align:center;font-size:13px;margin-top:10px"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
let channels=[];
let country='';
let favOnly=false;
let grid=false;
let hls=null;
let current=null;
const favs=new Set(JSON.parse(localStorage.getItem('iptv_favorites')||'[]'));

function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function saveFavs(){localStorage.setItem('iptv_favorites',JSON.stringify([...favs]))}
function setCountry(btn,c){country=c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===btn));render()}
function toggleFavorites(){favOnly=!favOnly;render()}
function toggleGrid(){grid=!grid;document.getElementById('app').classList.toggle('gridMode',grid)}
function toggleFav(id){if(favs.has(id))favs.delete(id);else favs.add(id);saveFavs();render()}
function togglePlayerFavorite(){if(!current)return;toggleFav(current.id)}

async function load(){
  try{
    const r=await fetch('/api/iptv/channels',{cache:'no-store'});
    const d=await r.json();
    channels=(d.channels||[]).filter(x=>x.status==='ONLINE');
    const groups=[...new Set(channels.map(x=>x.group||'Other'))].sort((a,b)=>a.localeCompare(b,'ru'));
    const sel=document.getElementById('group'),old=sel.value;
    sel.innerHTML='<option value="">ALL</option>'+groups.map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join('');
    if(groups.includes(old))sel.value=old;
    document.getElementById('status').textContent='Online: '+channels.length+' · Offline в проверке: '+((d.stats||{}).offline||0)+(d.running?' · обновляется…':'');
    render();
  }catch(e){
    document.getElementById('status').textContent='Ошибка загрузки каналов';
  }
}
async function refreshChannels(){
  document.getElementById('status').textContent='Обновление каналов…';
  await fetch('/api/iptv/refresh',{method:'POST'});
  setTimeout(load,2500);
  setTimeout(load,9000);
}
function render(){
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  const g=document.getElementById('group').value||'';
  const rows=channels.filter(x=>(!country||x.country===country)&&(!g||(x.group||'Other')===g)&&(!q||(x.name||'').toLowerCase().includes(q))&&(!favOnly||favs.has(x.id)));
  const grouped={};
  rows.forEach(x=>{const k=x.group||'Other';(grouped[k]||(grouped[k]=[])).push(x)});
  let out='';
  Object.keys(grouped).sort((a,b)=>a.localeCompare(b,'ru')).forEach(group=>{
    if(!grid)out+='<div class="groupTitle">'+esc(group)+'</div>';
    grouped[group].forEach(ch=>{
      const logo=ch.logo?'<img class="logo" src="'+esc(ch.logo)+'" onerror="this.outerHTML=\'<div class=logoFallback>TV</div>\'">':'<div class="logoFallback">TV</div>';
      out+='<div class="channel" onclick="openPlayer(\''+ch.id+'\')">'+
        '<div class="logoWrap">'+logo+'</div>'+
        '<div class="info"><div class="name">'+esc(ch.name)+'</div><div class="now">'+esc(ch.group||'Live')+'</div><div class="progress"><span></span></div><div class="times"><span>LIVE</span><span>'+Math.max(1,Math.round((ch.latency_ms||0)/1000))+'s</span></div></div>'+
        '<div class="side"><button class="more" onclick="event.stopPropagation()">⋮</button><button class="fav '+(favs.has(ch.id)?'on':'')+'" onclick="event.stopPropagation();toggleFav(\''+ch.id+'\')">♡</button><div class="country">'+(ch.country==='AM'?'AM':'RU')+'</div></div>'+
      '</div>';
    });
  });
  document.getElementById('list').innerHTML=out||'<div class="empty">Каналы не найдены</div>';
}
function openPlayer(id){
  const ch=channels.find(x=>x.id===id); if(!ch)return; current=ch;
  document.getElementById('playerTitle').textContent=ch.name;
  document.getElementById('playerName').textContent=ch.name;
  document.getElementById('playerGroup').textContent=(ch.country==='AM'?'Армения':'Россия')+' · '+(ch.group||'Live');
  document.getElementById('playerError').textContent='';
  document.getElementById('playerView').classList.add('open');
  const v=document.getElementById('video');
  if(hls){hls.destroy();hls=null}
  v.pause();v.removeAttribute('src');v.load();
  const src='/api/iptv/play?id='+encodeURIComponent(ch.id);
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true,lowLatencyMode:false});
    hls.loadSource(src);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d&&d.fatal)document.getElementById('playerError').textContent='Поток сейчас недоступен'});
  }else{
    v.src=src;v.load();v.play().catch(()=>document.getElementById('playerError').textContent='Поток сейчас недоступен');
  }
}
function closePlayer(){
  if(hls){hls.destroy();hls=null}
  const v=document.getElementById('video');v.pause();v.removeAttribute('src');v.load();
  document.getElementById('playerView').classList.remove('open');current=null;
}
async function toggleFullscreen(){
  const v=document.getElementById('video');
  try{
    if(document.fullscreenElement){await document.exitFullscreen();return}
    if(v.requestFullscreen){await v.requestFullscreen();return}
    if(v.webkitEnterFullscreen){v.webkitEnterFullscreen();return}
  }catch(e){}
}
load();
setInterval(load,60000);
</script>
</body>
</html>
