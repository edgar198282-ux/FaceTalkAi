name: Abaj TV KinoPub Lab Check

on:
  push:
    branches: [ "abajtv-kinopub-lab" ]
    paths:
      - "app/**"
      - "web/**"
      - ".github/workflows/kinopub-lab.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python syntax
        run: python -m py_compile app/webapp_plus.py

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Inline JS syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('web/index.html').read_text(encoding='utf-8')
          start=s.find('<script>')
          end=s.find('</script>', start)
          if start < 0 or end < 0:
              raise SystemExit('inline script not found')
          Path('/tmp/abajtv-inline.js').write_text(s[start+8:end], encoding='utf-8')
          PY
          node --check /tmp/abajtv-inline.js
