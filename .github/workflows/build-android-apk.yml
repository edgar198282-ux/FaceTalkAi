name: Build FaceTalk Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: facetalk-android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          echo "name=1.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restore real FaceTalk logo
        shell: bash
        run: |
          set -euo pipefail
          cp web/facetalk_logo.png android/app/src/main/res/drawable/facetalk_logo.png
          test -s android/app/src/main/res/drawable/facetalk_logo.png
          file android/app/src/main/res/drawable/facetalk_logo.png

      - name: Restore and validate signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 -d android/facetalk-upload-key.jks.b64 > android/facetalk-upload-key.jks
          test -s android/facetalk-upload-key.jks
          keytool -list -keystore android/facetalk-upload-key.jks -storepass FaceTalk2026 -alias facetalk >/tmp/facetalk-key.txt
          grep -qi "PrivateKeyEntry" /tmp/facetalk-key.txt

      - name: Build signed release APK
        working-directory: android
        env:
          FACETALK_WEB_APP_URL: ${{ vars.FACETALK_WEB_APP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WEB_APP_URL="${FACETALK_WEB_APP_URL:-https://facetalkai-production.up.railway.app}"
          case "$WEB_APP_URL" in https://*) ;; *) echo "::error::FACETALK_WEB_APP_URL must start with https://"; exit 1 ;; esac
          gradle :app:assembleRelease -PWEB_APP_URL="$WEB_APP_URL" -PAPP_VERSION_NAME="${{ steps.version.outputs.name }}" -PAPP_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Verify signed installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "REAL APK SIZE: $SIZE bytes"
          test "$SIZE" -ge 300000
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/facetalk-apk-list.txt
          grep -q "AndroidManifest.xml" /tmp/facetalk-apk-list.txt
          grep -q "classes.dex" /tmp/facetalk-apk-list.txt
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee /tmp/facetalk-badging.txt
          grep -q "package: name='ai.facetalk.app'" /tmp/facetalk-badging.txt
          grep -q "launchable-activity: name='ai.facetalk.app.MainActivity'" /tmp/facetalk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FaceTalkAI-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FaceTalkAI-latest.apk"
          sha256sum dist/FaceTalkAI-${{ steps.version.outputs.name }}.apk dist/FaceTalkAI-latest.apk > dist/SHA256SUMS.txt
          ls -lh dist/*.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceTalkAI-${{ steps.version.outputs.name }}
          path: |
            dist/FaceTalkAI-${{ steps.version.outputs.name }}.apk
            dist/FaceTalkAI-latest.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK as latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="facetalk-latest"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "dist/FaceTalkAI-${{ steps.version.outputs.name }}.apk#FaceTalkAI-${{ steps.version.outputs.name }}.apk" \
            "dist/FaceTalkAI-latest.apk#FaceTalkAI-latest.apk" \
            "dist/SHA256SUMS.txt#SHA256SUMS.txt" \
            --target "${{ github.sha }}" \
            --title "FaceTalk AI Android ${{ steps.version.outputs.name }}" \
            --notes "Verified signed APK with stable FaceTalkAI-latest.apk asset for Mini App installation."

      - name: Publish OTA to Railway
        shell: bash
        env:
          SECRET_TOKEN: ${{ secrets.FACETALK_APK_DEPLOY_TOKEN }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_API_SECRET }}
          VARIABLE_TOKEN: ${{ vars.FACETALK_APK_DEPLOY_TOKEN }}
          FACETALK_WEB_APP_URL: ${{ vars.FACETALK_WEB_APP_URL }}
        run: |
          set -euo pipefail
          APK_DEPLOY_TOKEN="${SECRET_TOKEN:-${VARIABLE_TOKEN:-$INTERNAL_TOKEN}}"
          if [ -z "$APK_DEPLOY_TOKEN" ]; then
            echo "::error::Set FACETALK_APK_DEPLOY_TOKEN or INTERNAL_API_SECRET in GitHub Actions secrets"
            exit 1
          fi
          WEB_APP_URL="${FACETALK_WEB_APP_URL:-https://facetalkai-production.up.railway.app}"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          for attempt in $(seq 1 36); do
            HTTP_CODE=$(curl -sS -o /tmp/facetalk-ota.json -w "%{http_code}" --connect-timeout 10 --max-time 180 -X POST "${WEB_APP_URL%/}/api/app-upload" -H "Content-Type: application/vnd.android.package-archive" -H "X-FaceTalk-Deploy-Token: $APK_DEPLOY_TOKEN" -H "X-FaceTalk-App-Version: ${{ steps.version.outputs.name }}" -H "X-FaceTalk-App-Version-Code: ${{ steps.version.outputs.code }}" --data-binary "@$APK" || true)
            cat /tmp/facetalk-ota.json 2>/dev/null || true
            if [ "$HTTP_CODE" = "200" ]; then echo "FaceTalk OTA published successfully"; exit 0; fi
            echo "OTA attempt $attempt/36 returned HTTP $HTTP_CODE"; sleep 10
          done
          echo "::error::FaceTalk APK was built but OTA publication failed"
          exit 1
