name: Build Abaj TV Android APK

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: OTA channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
  push:
    branches: [ "main" ]

concurrency:
  group: facetalk-android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'stable' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Smoke check backend and web
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/iptv.py app/webapp_plus.py iptv_worker.py
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('web/index.html').read_text(encoding='utf-8')
          parts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.S|re.I)
          Path('/tmp/abajtv-inline.js').write_text('\n'.join(parts),encoding='utf-8')
          PY
          node --check /tmp/abajtv-inline.js

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # Keep Android versionCode monotonic. Older stable builds used a Unix
          # timestamp (~1.79B), so GitHub run numbers such as 618 are rejected
          # by installed TVs as INSTALL_FAILED_VERSION_DOWNGRADE.
          CODE="$(date +%s)"
          echo "name=1.2.$CODE" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Validate Abaj TV branding
        shell: bash
        run: |
          set -euo pipefail
          cp web/abaj_tv_logo.jpg android/app/src/main/res/drawable/abaj_tv_logo.jpg
          test -s android/app/src/main/res/drawable/abaj_tv_logo.jpg
          file android/app/src/main/res/drawable/abaj_tv_logo.jpg

      - name: Restore and validate signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 -d android/facetalk-upload-key.jks.b64 > android/facetalk-upload-key.jks
          test -s android/facetalk-upload-key.jks
          keytool -list -keystore android/facetalk-upload-key.jks -storepass FaceTalk2026 -alias facetalk >/tmp/facetalk-key.txt
          grep -qi "PrivateKeyEntry" /tmp/facetalk-key.txt

      - name: Build signed release APK
        working-directory: android
        env:
          FACETALK_WEB_APP_URL: ${{ vars.FACETALK_WEB_APP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WEB_APP_URL="${FACETALK_WEB_APP_URL:-https://facetalkai-production.up.railway.app}"
          case "$WEB_APP_URL" in https://*) ;; *) echo "::error::FACETALK_WEB_APP_URL must start with https://"; exit 1 ;; esac
          gradle :app:assembleRelease -PWEB_APP_URL="$WEB_APP_URL" -PAPP_VERSION_NAME="${{ steps.version.outputs.name }}" -PAPP_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Verify signed installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "REAL APK SIZE: $SIZE bytes"
          test "$SIZE" -ge 300000
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/facetalk-apk-list.txt
          grep -q "AndroidManifest.xml" /tmp/facetalk-apk-list.txt
          grep -q "classes.dex" /tmp/facetalk-apk-list.txt
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee /tmp/facetalk-badging.txt
          grep -q "package: name='ai.facetalk.app'" /tmp/facetalk-badging.txt
          grep -q "launchable-activity: name='ai.facetalk.app.MainActivity'" /tmp/facetalk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/abajtv-signature.txt
          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/abajtv-signature.txt
          cp "$APK" /tmp/AbajTV-standard.apk

      - name: Build Android TV compatibility APK
        working-directory: android
        env:
          FACETALK_WEB_APP_URL: ${{ vars.FACETALK_WEB_APP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WEB_APP_URL="${FACETALK_WEB_APP_URL:-https://facetalkai-production.up.railway.app}"
          gradle :app:assembleRelease \
            -PWEB_APP_URL="$WEB_APP_URL" \
            -PAPP_ID="ai.abaj.tv" \
            -PAPP_VERSION_NAME="${{ steps.version.outputs.name }}" \
            -PAPP_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Verify Android TV compatibility APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee /tmp/abajtv-tv-badging.txt
          grep -q "package: name='ai.abaj.tv'" /tmp/abajtv-tv-badging.txt
          grep -q "sdkVersion:'21'" /tmp/abajtv-tv-badging.txt
          grep -q "leanback-launchable-activity: name='ai.facetalk.app.MainActivity'" /tmp/abajtv-tv-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/abajtv-tv-signature.txt
          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/abajtv-tv-signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/abajtv-tv-signature.txt

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp /tmp/AbajTV-standard.apk "dist/AbajTV-${{ steps.version.outputs.name }}.apk"
          cp /tmp/AbajTV-standard.apk "dist/AbajTV-latest.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/AbajTV-TV-compat.apk"
          sha256sum dist/AbajTV-${{ steps.version.outputs.name }}.apk dist/AbajTV-latest.apk dist/AbajTV-TV-compat.apk > dist/SHA256SUMS.txt
          ls -lh dist/*.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbajTV-${{ steps.version.outputs.name }}
          path: |
            dist/AbajTV-${{ steps.version.outputs.name }}.apk
            dist/AbajTV-latest.apk
            dist/AbajTV-TV-compat.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK as latest GitHub Release
        if: env.RELEASE_CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="abajtv-latest"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "dist/AbajTV-${{ steps.version.outputs.name }}.apk#AbajTV-${{ steps.version.outputs.name }}.apk" \
            "dist/AbajTV-latest.apk#AbajTV-latest.apk" \
            "dist/AbajTV-TV-compat.apk#AbajTV-TV-compat.apk" \
            "dist/SHA256SUMS.txt#SHA256SUMS.txt" \
            --target "${{ github.sha }}" \
            --title "Abaj TV Android ${{ steps.version.outputs.name }}" \
            --notes "Verified signed APK with stable AbajTV-latest.apk asset for Mini App installation."

      - name: Publish OTA to Railway
        shell: bash
        env:
          SECRET_TOKEN: ${{ secrets.FACETALK_APK_DEPLOY_TOKEN }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_API_SECRET }}
          VARIABLE_TOKEN: ${{ vars.FACETALK_APK_DEPLOY_TOKEN }}
          FACETALK_WEB_APP_URL: ${{ vars.FACETALK_WEB_APP_URL }}
        run: |
          set -euo pipefail
          APK_DEPLOY_TOKEN="${SECRET_TOKEN:-${VARIABLE_TOKEN:-$INTERNAL_TOKEN}}"
          if [ -z "$APK_DEPLOY_TOKEN" ]; then
            echo "::error::Set FACETALK_APK_DEPLOY_TOKEN or INTERNAL_API_SECRET in GitHub Actions secrets"
            exit 1
          fi
          WEB_APP_URL="${FACETALK_WEB_APP_URL:-https://facetalkai-production.up.railway.app}"
          # Stable OTA must always publish the standard phone APK. The build output
          # below is overwritten later by the TV-compat build, so use the preserved
          # standard artifact from /tmp instead of app-release.apk.
          APK="/tmp/AbajTV-standard.apk"
          test -s "$APK"
          for attempt in $(seq 1 36); do
            HTTP_CODE=$(curl -sS -o /tmp/facetalk-ota.json -w "%{http_code}" --connect-timeout 10 --max-time 180 -X POST "${WEB_APP_URL%/}/api/app-upload" -H "Content-Type: application/vnd.android.package-archive" -H "X-FaceTalk-Deploy-Token: $APK_DEPLOY_TOKEN" -H "X-FaceTalk-App-Version: ${{ steps.version.outputs.name }}" -H "X-FaceTalk-App-Version-Code: ${{ steps.version.outputs.code }}" -H "X-AbajTV-Channel: $RELEASE_CHANNEL" --data-binary "@$APK" || true)
            cat /tmp/facetalk-ota.json 2>/dev/null || true
            if [ "$HTTP_CODE" = "200" ]; then echo "Abaj TV OTA published successfully"; exit 0; fi
            echo "OTA attempt $attempt/36 returned HTTP $HTTP_CODE"; sleep 10
          done
          echo "::error::Abaj TV APK was built but OTA publication failed"
          exit 1


      - name: Verify Railway OTA publication
        shell: bash
        env:
          FACETALK_WEB_APP_URL: ${{ vars.FACETALK_WEB_APP_URL }}
        run: |
          set -euo pipefail
          WEB_APP_URL="${FACETALK_WEB_APP_URL:-https://facetalkai-production.up.railway.app}"
          EXPECTED_CODE="${{ steps.version.outputs.code }}"
          CHANNEL="$RELEASE_CHANNEL"
          for attempt in $(seq 1 18); do
            if python - "$WEB_APP_URL" "$CHANNEL" "$EXPECTED_CODE" <<'PY'
          import json,sys,urllib.request
          base,channel,expected=sys.argv[1],sys.argv[2],int(sys.argv[3])
          with urllib.request.urlopen(base.rstrip('/') + '/api/app-release?channel=' + channel, timeout=20) as r:
              data=json.load(r)
          ok=bool(data.get('available')) and int(data.get('version_code') or 0)==expected and int(data.get('size_bytes') or 0)>=300000
          print(json.dumps(data,ensure_ascii=False))
          raise SystemExit(0 if ok else 1)
          PY
            then
              echo "Verified OTA $CHANNEL version code $EXPECTED_CODE"
              exit 0
            fi
            echo "OTA verify attempt $attempt/18 did not match yet"
            sleep 5
          done
          echo "::error::Railway OTA verification failed for channel $CHANNEL code $EXPECTED_CODE"
          exit 1

