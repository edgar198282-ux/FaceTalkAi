name: Build FaceTalk Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name"
        required: true
        default: "1.0.0"
      version_code:
        description: "Android versionCode"
        required: true
        default: "1"
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore and validate signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 -d android/facetalk-upload-key.jks.b64 > android/facetalk-upload-key.jks
          test -s android/facetalk-upload-key.jks
          keytool -list -keystore android/facetalk-upload-key.jks -storepass FaceTalk2026 -alias facetalk >/tmp/facetalk-key.txt
          grep -qi "PrivateKeyEntry" /tmp/facetalk-key.txt

      - name: Build signed release APK
        working-directory: android
        env:
          FACETALK_WEB_APP_URL: ${{ vars.FACETALK_WEB_APP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WEB_APP_URL="${FACETALK_WEB_APP_URL:-https://facetalkai-production.up.railway.app}"
          case "$WEB_APP_URL" in
            https://*) ;;
            *) echo "::error::FACETALK_WEB_APP_URL must start with https://"; exit 1 ;;
          esac
          gradle :app:assembleRelease \
            -PWEB_APP_URL="$WEB_APP_URL" \
            -PAPP_VERSION_NAME="${{ steps.version.outputs.name }}" \
            -PAPP_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Verify production FaceTalk APK, runtime and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "REAL APK SIZE: $SIZE bytes"
          if [ "$SIZE" -lt 300000 ]; then
            echo "::error::APK is too small for the production Android shell: $SIZE bytes"
            exit 1
          fi
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | tee /tmp/facetalk-apk-list.txt
          grep -q "AndroidManifest.xml" /tmp/facetalk-apk-list.txt
          grep -q "classes.dex" /tmp/facetalk-apk-list.txt
          unzip -p "$APK" classes.dex | strings | grep -q "androidx/webkit"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | tee /tmp/facetalk-badging.txt
          grep -q "package: name='ai.facetalk.app'" /tmp/facetalk-badging.txt
          grep -q "launchable-activity: name='ai.facetalk.app.MainActivity'" /tmp/facetalk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Package direct APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FaceTalkAI-${{ steps.version.outputs.name }}.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          ls -lh dist/*.apk

      - name: Upload APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FaceTalkAI-${{ steps.version.outputs.name }}
          path: |
            dist/FaceTalkAI-${{ steps.version.outputs.name }}.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable FaceTalk APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="facetalk-android-${{ steps.version.outputs.code }}"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "dist/FaceTalkAI-${{ steps.version.outputs.name }}.apk#FaceTalkAI-${{ steps.version.outputs.name }}.apk" \
            "dist/SHA256SUMS.txt#SHA256SUMS.txt" \
            --title "FaceTalk AI Android ${{ steps.version.outputs.name }}" \
            --notes "Verified signed production FaceTalk AI Android APK. Direct .apk is attached to this Release."
          gh release view "$TAG" --json url,tagName,name

      - name: Publish OTA to Railway when configured
        shell: bash
        env:
          SECRET_TOKEN: ${{ secrets.FACETALK_APK_DEPLOY_TOKEN }}
          VARIABLE_TOKEN: ${{ vars.FACETALK_APK_DEPLOY_TOKEN }}
          FACETALK_WEB_APP_URL: ${{ vars.FACETALK_WEB_APP_URL }}
        run: |
          set +e
          APK_DEPLOY_TOKEN="${SECRET_TOKEN:-$VARIABLE_TOKEN}"
          if [ -z "$APK_DEPLOY_TOKEN" ]; then
            echo "OTA skipped: no FaceTalk deploy token configured. GitHub Release APK is ready."
            exit 0
          fi
          WEB_APP_URL="${FACETALK_WEB_APP_URL:-https://facetalkai-production.up.railway.app}"
          RELEASE_URL="${WEB_APP_URL%/}/api/app-release"
          READY=0
          for attempt in $(seq 1 6); do
            HTTP_CODE=$(curl -sS -o /tmp/facetalk-release.json -w "%{http_code}" --connect-timeout 10 --max-time 30 "$RELEASE_URL" || true)
            if [ "$HTTP_CODE" = "200" ]; then READY=1; break; fi
            sleep 5
          done
          if [ "$READY" != "1" ]; then
            echo "OTA endpoint not ready; GitHub Release APK remains valid."
            exit 0
          fi
          APK="android/app/build/outputs/apk/release/app-release.apk"
          ENDPOINT="${WEB_APP_URL%/}/api/app-upload"
          HTTP_CODE=$(curl -sS -o /tmp/facetalk-apk.json -w "%{http_code}" --connect-timeout 10 --max-time 180 \
            -X POST "$ENDPOINT" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "X-FaceTalk-Deploy-Token: $APK_DEPLOY_TOKEN" \
            -H "X-FaceTalk-App-Version: ${{ steps.version.outputs.name }}" \
            -H "X-FaceTalk-App-Version-Code: ${{ steps.version.outputs.code }}" \
            --data-binary "@$APK")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "FaceTalk OTA published successfully"
          else
            echo "OTA publish skipped/failed with HTTP $HTTP_CODE; GitHub Release APK remains valid."
          fi
          exit 0
