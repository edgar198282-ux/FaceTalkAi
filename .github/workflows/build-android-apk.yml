name: Build FaceTalk Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name"
        required: true
        default: "1.0.0"
      version_code:
        description: "Android versionCode"
        required: true
        default: "1"
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing key
        shell: bash
        run: |
          base64 -d android/facetalk-upload-key.jks.b64 > android/facetalk-upload-key.jks
          test -s android/facetalk-upload-key.jks

      - name: Build signed release APK
        working-directory: android
        env:
          FACETALK_WEB_APP_URL: ${{ vars.FACETALK_WEB_APP_URL }}
        shell: bash
        run: |
          WEB_APP_URL="${FACETALK_WEB_APP_URL:-https://facetalkai-production.up.railway.app}"
          case "$WEB_APP_URL" in
            https://*) ;;
            *) echo "::error::FACETALK_WEB_APP_URL must start with https://"; exit 1 ;;
          esac
          gradle :app:assembleRelease \
            -PWEB_APP_URL="$WEB_APP_URL" \
            -PAPP_VERSION_NAME="${{ steps.version.outputs.name }}" \
            -PAPP_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Verify APK signature
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to FaceTalk Railway
        shell: bash
        env:
          FACETALK_WEB_APP_URL: ${{ vars.FACETALK_WEB_APP_URL }}
          FACETALK_APK_DEPLOY_TOKEN: ${{ secrets.FACETALK_APK_DEPLOY_TOKEN }}
        run: |
          WEB_APP_URL="${FACETALK_WEB_APP_URL:-https://facetalkai-production.up.railway.app}"
          if [ -z "$FACETALK_APK_DEPLOY_TOKEN" ]; then
            echo "::error::FACETALK_APK_DEPLOY_TOKEN secret is missing in GitHub Actions"
            exit 1
          fi
          APK="android/app/build/outputs/apk/release/app-release.apk"
          ENDPOINT="${WEB_APP_URL%/}/api/app-upload"
          for attempt in $(seq 1 36); do
            HTTP_CODE=$(curl -sS -o /tmp/facetalk-apk.json -w "%{http_code}" \
              --connect-timeout 10 --max-time 120 \
              -X POST "$ENDPOINT" \
              -H "Content-Type: application/vnd.android.package-archive" \
              -H "X-FaceTalk-Deploy-Token: $FACETALK_APK_DEPLOY_TOKEN" \
              -H "X-FaceTalk-App-Version: ${{ steps.version.outputs.name }}" \
              -H "X-FaceTalk-App-Version-Code: ${{ steps.version.outputs.code }}" \
              --data-binary "@$APK" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              cat /tmp/facetalk-apk.json
              echo
              echo "FaceTalk APK published"
              exit 0
            fi
            echo "Publish attempt $attempt/36 returned HTTP $HTTP_CODE"
            cat /tmp/facetalk-apk.json 2>/dev/null || true
            echo
            sleep 10
          done
          echo "::error::Could not publish FaceTalk APK to Railway"
          exit 1

      - name: Package APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FaceTalkAI-${{ steps.version.outputs.name }}.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: facetalk-android-${{ steps.version.outputs.name }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
