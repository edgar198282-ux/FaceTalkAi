name: Build FaceTalk Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name"
        required: true
        default: "1.0.0"
      version_code:
        description: "Android versionCode"
        required: true
        default: "1"
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - "app/webapp_plus.py"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore and validate signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 -d android/facetalk-upload-key.jks.b64 > android/facetalk-upload-key.jks
          test -s android/facetalk-upload-key.jks
          keytool -list \
            -keystore android/facetalk-upload-key.jks \
            -storepass FaceTalk2026 \
            -alias facetalk >/tmp/facetalk-key.txt
          grep -qi "PrivateKeyEntry" /tmp/facetalk-key.txt

      - name: Build signed release APK
        working-directory: android
        env:
          FACETALK_WEB_APP_URL: ${{ vars.FACETALK_WEB_APP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WEB_APP_URL="${FACETALK_WEB_APP_URL:-https://facetalkai-production.up.railway.app}"
          case "$WEB_APP_URL" in
            https://*) ;;
            *) echo "::error::FACETALK_WEB_APP_URL must start with https://"; exit 1 ;;
          esac
          gradle :app:assembleRelease \
            -PWEB_APP_URL="$WEB_APP_URL" \
            -PAPP_VERSION_NAME="${{ steps.version.outputs.name }}" \
            -PAPP_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Verify FaceTalk APK contents and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "Actual APK size: $SIZE bytes"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | tee /tmp/facetalk-apk-list.txt
          grep -q "AndroidManifest.xml" /tmp/facetalk-apk-list.txt
          grep -q "classes.dex" /tmp/facetalk-apk-list.txt
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | tee /tmp/facetalk-badging.txt
          grep -q "package: name='ai.facetalk.app'\|package: name='com.facetalk.ai'\|package: name='ai.facetalk'" /tmp/facetalk-badging.txt || {
            echo "FaceTalk package info:"; cat /tmp/facetalk-badging.txt; exit 1;
          }
          grep -q "launchable-activity:" /tmp/facetalk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Package direct APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FaceTalkAI-${{ steps.version.outputs.name }}.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: facetalk-android-${{ steps.version.outputs.name }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct FaceTalk APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="facetalk-android-${{ steps.version.outputs.code }}"
          TITLE="FaceTalk AI Android ${{ steps.version.outputs.name }}"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "dist/FaceTalkAI-${{ steps.version.outputs.name }}.apk#FaceTalkAI-${{ steps.version.outputs.name }}.apk" \
            "dist/SHA256SUMS.txt#SHA256SUMS.txt" \
            --title "$TITLE" \
            --notes "Signed FaceTalk AI Android APK. Download the .apk file directly on Android; do not install the Actions artifact ZIP."

      - name: Wait for FaceTalk OTA endpoint
        shell: bash
        env:
          FACETALK_WEB_APP_URL: ${{ vars.FACETALK_WEB_APP_URL }}
        run: |
          set -euo pipefail
          WEB_APP_URL="${FACETALK_WEB_APP_URL:-https://facetalkai-production.up.railway.app}"
          RELEASE_URL="${WEB_APP_URL%/}/api/app-release"
          for attempt in $(seq 1 36); do
            HTTP_CODE=$(curl -sS -o /tmp/facetalk-release.json -w "%{http_code}" --connect-timeout 10 --max-time 30 "$RELEASE_URL" || true)
            if [ "$HTTP_CODE" = "200" ] && grep -q 'facetalk-ota' /tmp/facetalk-release.json; then
              exit 0
            fi
            echo "OTA preflight $attempt/36 returned HTTP $HTTP_CODE"
            sleep 10
          done
          echo "::error::FaceTalk OTA endpoint is not ready at $RELEASE_URL"
          exit 1

      - name: Publish APK to FaceTalk Railway
        shell: bash
        env:
          FACETALK_WEB_APP_URL: ${{ vars.FACETALK_WEB_APP_URL }}
          FACETALK_APK_DEPLOY_TOKEN: ${{ secrets.FACETALK_APK_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          WEB_APP_URL="${FACETALK_WEB_APP_URL:-https://facetalkai-production.up.railway.app}"
          if [ -z "$FACETALK_APK_DEPLOY_TOKEN" ]; then
            echo "::warning::Direct FaceTalk APK Release is ready, but FACETALK_APK_DEPLOY_TOKEN is missing; skipping Railway OTA publish."
            exit 0
          fi
          APK="android/app/build/outputs/apk/release/app-release.apk"
          ENDPOINT="${WEB_APP_URL%/}/api/app-upload"
          HTTP_CODE=$(curl -sS -o /tmp/facetalk-apk.json -w "%{http_code}" \
            --connect-timeout 10 --max-time 180 \
            -X POST "$ENDPOINT" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "X-FaceTalk-Deploy-Token: $FACETALK_APK_DEPLOY_TOKEN" \
            -H "X-FaceTalk-App-Version: ${{ steps.version.outputs.name }}" \
            -H "X-FaceTalk-App-Version-Code: ${{ steps.version.outputs.code }}" \
            --data-binary "@$APK" || true)
          if [ "$HTTP_CODE" != "200" ]; then
            cat /tmp/facetalk-apk.json 2>/dev/null || true
            echo "::error::FaceTalk APK publish returned HTTP $HTTP_CODE"
            exit 1
          fi
