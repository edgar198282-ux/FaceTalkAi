name: Build Abaj TV New Server APK
on:
  push:
    branches:
      - abajtv-new-railway
    paths:
      - 'android/**'
      - '.github/workflows/abajtv-new-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: abajtv-stable-ota
  cancel-in-progress: false
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set release version
        id: version
        run: |
          CODE=$(date -u +%s)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=1.2.$CODE" >> "$GITHUB_OUTPUT"
      - name: Build debug APK for testing
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug -PWEB_APP_URL=https://facetalkai-production-9387.up.railway.app -PAPP_VERSION_CODE=${{ steps.version.outputs.code }} -PAPP_VERSION_NAME=${{ steps.version.outputs.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: AbajTV-new-server-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Note OTA signing requirement
        run: |
          echo "Debug APK is available as a workflow artifact."
          echo "Stable OTA publishing requires the original Android signing keystore."
          echo "Do not publish a release signed with a different key."
