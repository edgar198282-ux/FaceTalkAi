name: Build Abaj TV New Server APK
on:
  push:
    branches:
      - abajtv-new-railway
    paths:
      - 'android/**'
      - '.github/workflows/abajtv-new-apk.yml'
  workflow_dispatch:
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK for the new Railway domain
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug -PWEB_APP_URL=https://facetalkai-production-9387.up.railway.app
      - uses: actions/upload-artifact@v4
        with:
          name: AbajTV-new-server-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
