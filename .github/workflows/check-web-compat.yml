name: Check WebView compatibility assets
on:
  pull_request:
  push:
    branches: [abajtv-new-railway]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_web_compat.py
